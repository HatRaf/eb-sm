[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ebasket-autopilot"
version = "0.1.0"
description = "Verified score posts for eBasket (EuroLeague / Greek Basket League)"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "PyYAML>=6.0",
    "tzdata>=2024.1",  # Windows has no system tz database; needed for Europe/Athens
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
ebasket = "ebasket.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ebasket = ["migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
